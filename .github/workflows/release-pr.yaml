name: Release PR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "major, minor, patch, or an explicit version such as 1.2.3"
        type: string
        default: patch

permissions:
  contents: read

jobs:
  release-pr:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-release-pr.yaml@af658176eefa1e1c912d6292f86980ac03536ffc
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
      version: ${{ inputs.version }}
      version-file: luxonis_train/__init__.py
      project-name: LuxonisTrain
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
