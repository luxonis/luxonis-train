name: Python Dependencies Updater

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-python-dependencies:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-dependencies-update.yaml@90b4157a4040727fe38905acecb02d75f2f9d768
    with:
      export-script: scripts/export_requirements.sh
      uv-version: "0.11.28"
    secrets:
      WORKFLOW_SECRET: ${{ secrets.WORKFLOW_SECRET }}
