name: Python Dependencies Updater

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-python-dependencies:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-dependencies-update.yaml@af658176eefa1e1c912d6292f86980ac03536ffc
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
      export-script: scripts/export_requirements.sh
      uv-version: "0.11.28"
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
