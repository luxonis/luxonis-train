name: Python Dependencies Updater

on:
  schedule:
    - cron: "0 1 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-python-dependencies:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v8.1.0
        with:
          version: "0.11.28"
          enable-cache: true

      - name: Upgrade and export dependencies
        run: |
          uv lock --upgrade
          scripts/export_requirements.sh

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v7.0.11
        with:
          token: ${{ secrets.WORKFLOW_SECRET }}
          branch: chore/update-python-dependencies
          delete-branch: true
          commit-message: "chore: update Python dependencies"
          title: "chore: update Python dependencies"
          body: |
            Automated update of `uv.lock` and the exported `requirements*.txt` files.
          labels: automated
