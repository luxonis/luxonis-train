name: GitHub Actions Version Updater

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-github-actions:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-actions-update.yaml@af658176eefa1e1c912d6292f86980ac03536ffc
    with:
      app-client-id: ${{ vars.ML_BOT_APP_CLIENT_ID }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.ML_BOT_APP_PRIVATE_KEY }}
