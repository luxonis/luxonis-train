name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-python-publish.yaml@59ca6fe93e5c854289dba1e4dede0700ee57d658
    with:
      uv-version: "0.11.28"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
