name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-python-publish.yaml@1556182be18dd350dbeb5b07bc7282e17828b655
    with:
      uv-version: "0.11.28"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
