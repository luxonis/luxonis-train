name: Upload Python Package

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    uses: luxonis/luxonis-ml/.github/workflows/reusable-python-publish.yaml@90b4157a4040727fe38905acecb02d75f2f9d768
    with:
      uv-version: "0.11.28"
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
