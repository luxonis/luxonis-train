name: CI

on:
  workflow_dispatch:
    inputs:
      cancel_in_progress:
        description: "Cancel an in-progress run in the same concurrency group"
        required: false
        type: boolean
        default: true
      concurrency_group:
        description: "Optional concurrency group for an external caller"
        required: false
        default: ""
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        default: main
      train_ref:
        description: "luxonis-train version (branch/tag/SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      cancel_in_progress:
        description: "Cancel an in-progress run in the same concurrency group"
        required: false
        type: boolean
        default: true
      concurrency_group:
        description: "Optional concurrency group for an external caller"
        required: false
        type: string
        default: ""
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        type: string
        default: main
      train_ref:
        description: "luxonis-train version (branch/tag/SHA)"
        required: false
        type: string
        default: main
    secrets:
      GOOGLE_APPLICATION_CREDENTIALS:
        description: "GCP service-account JSON"
        required: true
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: true
      HUBAI_API_KEY:
        description: "HubAI API key"
        required: true
  pull_request:
    paths:
      - "requirements.txt"
      - "pyproject.toml"
      - "luxonis_train/**"
      - "tests/**"
      - ".github/workflows/ci.yaml"
      - "!**/*.md"

concurrency:
  # External callers can provide an isolated concurrency group.
  group: ${{ inputs.concurrency_group || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ inputs.cancel_in_progress || !inputs.concurrency_group }}

permissions:
  pull-requests: write
  contents: write
  checks: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install pre-commit
        run: python -m pip install 'pre-commit<4.0.0'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # CI can run from a checked-out protected branch via workflow_call.
          # Keep this hook for local commits, but skip it for full CI lint runs.
          SKIP: no-commit-to-branch

  docs:
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install dependencies
        run: pip install pydoctor

      - name: Build docs
        run: pydoctor --docformat=epytext luxonis_train

  type-check:
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev,aimet] --extra-index-url https://download.pytorch.org/whl/cu130

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip uninstall luxonis-ml -y
          pip install "luxonis-ml[data,tracker] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Pyright check
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef
        with:
          level: warning
          warnings: true
          python-version: "3.10"
          project: pyproject.toml

  # Tests that the `luxonis-train.config.Config` works
  # even when the dependencies of `luxonis-train` are
  # not installed.
  config-test:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - type-check
      - docs

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip

      - name: Install released version of LuxonisML
        if: ${{ !inputs.ml_ref && startsWith(github.head_ref, 'release/') }}
        run: pip install luxonis-ml[utils]

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip install "luxonis-ml[utils] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Install dependencies for config test
        run: |
          pip install pytest-cov semver~=3.0
          pip install -e . --no-deps

      - name: Test config without dependencies
        run: |
          pytest -x tests/unittests/test_config.py \
            --confcutdir=tests/unittests \
            --cov=luxonis_train/config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 \
            --junitxml=junit.xml \
            -o junit_family=legacy

  tests:
    needs:
      - config-test

    strategy:
      matrix:
        suite: [unit, predefined_light, predefined_heavy, combinations, misc]

    runs-on: ${{ matrix.suite == 'unit' && 'ubuntu-latest' || 'ubuntu-t4-4core' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev,aimet] --extra-index-url https://download.pytorch.org/whl/cu130

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip uninstall luxonis-ml -y
          pip install "luxonis-ml[data,tracker] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Run pytest
        env:
          LUXONISML_BUCKET: luxonis-test-bucket
          SUITE: ${{ matrix.suite }}
          HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
        run: pytest -x --cov --junitxml=junit.xml -o junit_family=legacy -m "${SUITE}"

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: ${{ matrix.suite }}

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: ${{ matrix.suite }}

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.suite }}
          path: coverage.xml
          overwrite: true
