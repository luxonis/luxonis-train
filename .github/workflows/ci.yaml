name: CI

on:
  workflow_dispatch:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        default: main
      train_ref:
        description: "luxonis-train version (branch/tag/SHA)"
        required: false
        default: main
  workflow_call:
    inputs:
      ml_ref:
        description: "luxonis-ml version (branch/tag/SHA)"
        required: false
        type: string
        default: main
      train_ref:
        description: "luxonis-train version (branch/tag/SHA)"
        required: false
        type: string
        default: main
    secrets:
      GOOGLE_APPLICATION_CREDENTIALS:
        description: "GCP service-account JSON"
        required: true
      CODECOV_TOKEN:
        description: "Codecov upload token"
        required: true
      HUBAI_API_KEY:
        description: "HubAI API key"
        required: true
  pull_request:
    paths:
      - "requirements.txt"
      - "pyproject.toml"
      - "luxonis_train/**"
      - "tests/**"
      - ".github/workflows/ci.yaml"
      - "!**/*.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write
  checks: write

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install pre-commit
        run: python -m pip install 'pre-commit<4.0.0'

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1
        env:
          # CI can run from a checked-out protected branch via workflow_call.
          # Keep this hook for local commits, but skip it for full CI lint runs.
          SKIP: no-commit-to-branch

  docs:
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Install dependencies
        run: pip install pydoctor

      - name: Build docs
        run: pydoctor --docformat=epytext luxonis_train

  type-check:
    needs:
      - pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: pip install -e .[dev,aimet] --extra-index-url https://download.pytorch.org/whl/cu130

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip uninstall luxonis-ml -y
          pip install "luxonis-ml[data,tracker] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Pyright check
        uses: jakebailey/pyright-action@8ec14b5cfe41f26e5f41686a31eb6012758217ef
        with:
          level: warning
          warnings: true
          python-version: "3.10"
          project: pyproject.toml

  # Tests that the `luxonis-train.config.Config` works
  # even when the dependencies of `luxonis-train` are
  # not installed.
  config-test:
    runs-on: ubuntu-latest
    needs:
      - pre-commit
      - type-check
      - docs

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Install released version of LuxonisML
        if: ${{ !inputs.ml_ref && startsWith(github.head_ref, 'release/') }}
        run: pip install luxonis-ml[utils]

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip install "luxonis-ml[utils] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Install dependencies for config test
        run: |
          pip install pytest-cov semver~=3.0
          pip install -e . --no-deps

      - name: Test config without dependencies
        run: |
          pytest -x tests/unittests/test_config.py \
            --confcutdir=tests/unittests \
            --cov=luxonis_train/config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=100 \
            --junitxml=junit.xml \
            -o junit_family=legacy

  tests:
    needs:
      - config-test

    strategy:
      fail-fast: false
      matrix:
        suite: [unit, predefined, combinations, misc]
        group: [1, 2, 3, 4]

    runs-on: ${{ matrix.suite == 'unit' && 'ubuntu-latest' || 'ubuntu-t4-4core' }}

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: ${{ inputs.train_ref && 'Luxonis/luxonis-train' || github.repository }}
          ref: ${{ inputs.train_ref || github.head_ref || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.10"
          cache: pip

      - name: Restore pytest durations
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .pytest-durations
          key: pytest-durations-${{ matrix.suite }}-${{ github.run_id }}
          restore-keys: |
            pytest-durations-${{ matrix.suite }}-

      - name: Install dependencies
        run: pip install -e .[dev,aimet] --extra-index-url https://download.pytorch.org/whl/cu130

      - name: Install source version of LuxonisML
        if: ${{ inputs.ml_ref || !startsWith(github.head_ref, 'release/') }}
        env:
          ML_REF: ${{ inputs.ml_ref || 'main' }}
        run: |
          pip uninstall luxonis-ml -y
          pip install "luxonis-ml[data,tracker] @ git+https://github.com/luxonis/luxonis-ml.git@${ML_REF}"

      - name: Authenticate to Google Cloud
        id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true
          token_format: access_token

      - name: Run pytest
        shell: bash
        env:
          LUXONISML_BUCKET: luxonis-test-bucket
          HUBAI_API_KEY: ${{ secrets.HUBAI_API_KEY }}
        run: |
          junit_xml="junit-${{ matrix.suite }}-${{ matrix.group }}.xml"
          coverage_xml="coverage-${{ matrix.suite }}-${{ matrix.group }}.xml"
          mkdir -p .pytest-durations
          durations_path=".pytest-durations/.test_durations.${{ matrix.suite }}"
          pytest \
            -x \
            --cov \
            --cov-report "xml:$coverage_xml" \
            --splits 4 \
            --group "${{ matrix.group }}" \
            --durations-path "$durations_path" \
            --splitting-algorithm duration_based_chunks \
            --junitxml "$junit_xml" \
            -o junit_family=legacy \
            -m "${{ matrix.suite }}"

      - name: Upload test result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: junit-${{ matrix.suite }}-${{ matrix.group }}
          path: junit-${{ matrix.suite }}-${{ matrix.group }}.xml
          if-no-files-found: ignore

      - name: Upload test results to Codecov
        if: ${{ always() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: junit-${{ matrix.suite }}-${{ matrix.group }}.xml
          flags: ${{ matrix.suite }}
          name: pytest-${{ matrix.suite }}-${{ matrix.group }}
          disable_search: true
          handle_no_reports_found: true

      - name: Upload coverage results to Codecov
        if: ${{ always() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          files: coverage-${{ matrix.suite }}-${{ matrix.group }}.xml
          flags: ${{ matrix.suite }}
          name: pytest-${{ matrix.suite }}-${{ matrix.group }}
          disable_search: true
          handle_no_reports_found: true

      - name: Upload coverage as artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: coverage-${{ matrix.suite }}-${{ matrix.group }}
          path: coverage-${{ matrix.suite }}-${{ matrix.group }}.xml
          if-no-files-found: ignore
          overwrite: true
