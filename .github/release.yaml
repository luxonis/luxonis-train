# Groups the notes that `gh release create --generate-notes` writes.
changelog:
  exclude:
    labels:
      - release
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - fix
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - DevOps
        - tests
        - dependencies
        - automated
    - title: Other changes
      labels:
        - "*"
