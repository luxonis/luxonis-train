default_language_version:
  python: python3
repos:
  - repo: local
    hooks:
      - id: export-requirements
        name: Export pip compatibility requirements
        entry: scripts/export_requirements.sh
        language: system
        pass_filenames: false
        # Matches the outputs as well, so hand-edits to them get reverted.
        files: ^(pyproject\.toml|uv\.lock|requirements(-[a-z]+)?\.txt|scripts/export_requirements\.sh)$

  - repo: https://github.com/crate-ci/typos
    rev: v1.47.2
    hooks:
      - id: typos

  - repo: https://github.com/rohaquinlop/complexipy-pre-commit
    rev: v7.0.1
    hooks:
      - id: complexipy
        args: [--suggest-refactors]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        types_or: [python, pyi, jupyter]

  - repo: https://github.com/PyCQA/docformatter
    rev: v1.7.8
    hooks:
      - id: docformatter
        additional_dependencies: [tomli]
        args: [--in-place, --style=epytext, --close-quotes-on-newline]

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        additional_dependencies:
          - mdformat-gfm

  - repo: https://github.com/JoC0de/pre-commit-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [yaml]

  - repo: https://github.com/ComPWA/taplo-pre-commit
    rev: v0.9.3

    hooks:
      - id: taplo-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-docstring-first
        exclude: luxonis_train/typing.py
      - id: check-executables-have-shebangs
      - id: check-illegal-windows-names
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: check-yaml
      - id: check-json
      - id: pretty-format-json
        args:
          - "--autofix"
          - "--indent=4"
          - "--no-sort-keys"
      - id: detect-private-key
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main]
